[project]
name = "compass"
version = "0.0.1"
description = "Companion Proper Motion Analysis Software System"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Philipp Herz", email = "herzphilipp@outlook.com" },
    { name = "Matthias Samland", email = "m.samland@mailbox.org" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "astropy>=6.0",
    "astroquery>=0.4.9",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "scipy>=1.13",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/herzphi/compass"
"Bug Tracker" = "https://github.com/herzphi/compass/issues"
"Source Code" = "https://github.com/herzphi/compass"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "numpydoc",
    "sphinx-rtd-theme>=1.2.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-doctestplus",
    "codecov",
    "ruff",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 127
target-version = "py310"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E501", "E712", "E722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["compass"]

[tool.pytest.ini_options]
addopts = "--log-format='%(asctime)s %(levelname)s %(message)s' --log-date-format='%Y-%m-%d %H:%M:%S'"
markers = [
    "remote_data: tests that require a network connection to Gaia/Simbad",
]
